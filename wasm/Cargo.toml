[package]
name = "f2e-grid"
version = "0.1.0"
edition = "2024"
publish = false
description = "The module's WebAssembly: the scene store, the 3D raycast and the barrier visualizer's floor lighting (scripts/helpers/wasm.js loads it)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
i_overlay = "9.2"

[target.'cfg(target_family = "wasm")'.dependencies]
# a faster allocator for single-threaded WebAssembly than the standard one
talc = "5.1"


[features]
# time spent per step, for the native bench (examples/bench.rs); never in the shipped module
profile = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
